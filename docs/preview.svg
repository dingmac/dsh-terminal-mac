<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="A virtual Mac card with start, pause and stop controls, and an approval card beside it">
  <rect width="720" height="405" fill="#0d1117"/>
  <rect x="40" y="48" width="360" height="300" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="64" y="84" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#e6edf3" font-weight="600">Virtual Mac · default</text>
  <circle cx="76" cy="110" r="5" fill="#3fb950"/>
  <text x="92" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7ee787">running</text>
  <text x="64" y="146" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8b949e">2 CPU · 4 GiB · 48 GiB sparse · 1280×800</text>
  <rect x="64" y="164" width="312" height="120" rx="8" fill="#0b1220" stroke="#21262d" stroke-width="1"/>
  <text x="80" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#484f58">guest desktop</text>
  <rect x="64" y="304" width="96" height="30" rx="7" fill="#1f6feb" opacity="0.2" stroke="#1f6feb" stroke-width="1"/>
  <path d="M80 313v12l9-6z" fill="#58a6ff"/>
  <text x="96" y="324" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#58a6ff">Start</text>
  <rect x="172" y="304" width="96" height="30" rx="7" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <path d="M188 313h10M188 325h10" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round"/>
  <text x="204" y="324" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#c9d1d9">Pause</text>
  <rect x="280" y="304" width="96" height="30" rx="7" fill="#b62324" opacity="0.18" stroke="#f85149" stroke-width="1"/>
  <rect x="296" y="313" width="10" height="10" rx="1.5" fill="#f85149"/>
  <text x="312" y="324" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#ff7b72">Stop</text>
  <rect x="440" y="48" width="240" height="300" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="456" y="64" width="208" height="22" rx="5" fill="#1f6feb" opacity="0.15"/>
  <text x="466" y="79" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#58a6ff">approval required</text>
  <text x="456" y="112" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#e6edf3" font-weight="600">Shut down the virtual Mac?</text>
  <text x="456" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8b949e">Unsaved guest work may be lost.</text>
  <text x="456" y="152" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8b949e">关闭虚拟 Mac；未保存内容可能丢失。</text>
  <rect x="456" y="286" width="92" height="30" rx="7" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="480" y="306" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#c9d1d9">Deny</text>
  <rect x="560" y="286" width="104" height="30" rx="7" fill="#1f6feb"/>
  <text x="584" y="306" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#ffffff">Allow once</text>
  <text x="456" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#484f58">terminal_mac_vm_stop</text>
  <text x="456" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#484f58">terminal_mac_vm_start</text>
  <text x="456" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#484f58">terminal_mac_vm_pause</text>
</svg>
